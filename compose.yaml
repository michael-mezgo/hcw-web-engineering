services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bears
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bears
    # connect from the host (db:migrate, db:seed)
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bears -d bears']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3000'
      # 1 = also serve the debug routes (broken report version for the race demo)
      ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-0}
      DATABASE_URL: postgres://bears:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bears
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      CORS_ORIGINS: ${CORS_ORIGINS-http://localhost:4173,http://localhost:5173,http://localhost:8080}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  db-data:
